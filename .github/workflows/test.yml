name: Python application test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s
      # Throwaway database for the DB-backed tests in tests/test_auth.py
      # (they TRUNCATE on every test; never point them at a real database).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landmark_test
          POSTGRES_PASSWORD: landmark_test
          POSTGRES_DB: landmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landmark_test -d landmark_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verify app import with dummy production secrets
      env:
        FLASK_ENV: test                  # avoids strict Redis requirement
        SECRET_KEY: dummy-secret-key-for-ci
        JWT_SECRET_KEY: dummy-jwt-secret-for-ci
        DATABASE_URL: sqlite:///test.db
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -c "
        import sys, traceback
        try:
            from app import app
            print('SUCCESS: App imports OK')
        except Exception:
            traceback.print_exc()
            sys.exit(1)
        "

    # Test modules set their own dummy SECRET_KEY/JWT_SECRET_KEY/DATABASE_URL
    # (tests/conftest.py and os.environ.setdefault), so none are set here.
    - name: Run test suite
      run: pytest -q --ignore=tests/test_auth.py

    # Separate process, as its docstring requires: it must import the app
    # before routes.auth_routes for the rate-limit tests to be meaningful,
    # which another module in the same run can prevent.
    - name: Run auth, fraud-policy and referral tests against PostgreSQL
      env:
        TEST_DATABASE_URL: postgresql://landmark_test:landmark_test@localhost:5432/landmark_test
      # Fail on any skip too: a skipped DB test would otherwise look green.
      run: |
        pytest -q -rs tests/test_auth.py tests/test_fraud_policy.py tests/test_referral_audit.py | tee auth-tests.log
        if grep -q "skipped" auth-tests.log; then
          echo "::error::auth, fraud-policy or referral tests skipped in CI (see -rs reasons above)"
          exit 1
        fi

    - name: Lint with flake8 (optional, not failing)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true