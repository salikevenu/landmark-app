{% extends "layout.html" %}
{% block title %}Admin Login | LANDMARK{% endblock %}
{% block content %}
<div class="container">
  <h2>Admin Login</h2>
  <div class="card">
    <div class="form-group">
      <input type="text" id="phone" placeholder="Admin Phone Number">
    </div>
    <div class="form-group" id="otpGroup" style="display:none;">
      <input type="text" id="otp" placeholder="Enter OTP">
    </div>
    <button class="btn-primary" id="actionBtn" onclick="handleAction()">Send OTP</button>
    <p id="status"></p>
  </div>
</div>

<script>
let currentStep = 'phone';
const phoneInput = document.getElementById('phone');
const otpInput = document.getElementById('otp');
const otpGroup = document.getElementById('otpGroup');
const actionBtn = document.getElementById('actionBtn');
const statusEl = document.getElementById('status');

function handleAction() {
  if (currentStep === 'phone') {
    sendOTP();
  } else {
    verifyOTP();
  }
}

async function sendOTP() {
  const phone = phoneInput.value.trim();
  if (!phone) {
    statusEl.innerText = "Phone number required";
    return;
  }

  statusEl.innerText = "Sending OTP...";
  try {
    const res = await fetch("/api/auth/send-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();

    // ✅ ACCEPT MULTIPLE RESPONSE FORMATS
    if (res.ok && (data.status === "success" || data.success || data.message)) {
      otpGroup.style.display = "block";
      actionBtn.innerText = "Verify OTP";
      currentStep = 'otp';
      phoneInput.disabled = true;
      statusEl.innerText = "OTP sent (check Render logs for OTP)";
    } else {
      statusEl.innerText = data.error || data.message || "Failed to send OTP";
    }
  } catch (err) {
    statusEl.innerText = "Server error";
  }
}

async function verifyOTP() {
  const phone = phoneInput.value.trim();
  const otp = otpInput.value.trim();  // ✅ Already trimmed
  
  if (!otp) {
    statusEl.innerText = "OTP required";
    return;
  }

  statusEl.innerText = "Verifying...";
  try {
    const res = await fetch("/api/auth/verify-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        phone: phone, 
        otp: otp  // ✅ Sending as a string
      })
    });
    const data = await res.json();

    // ✅ Handle success (even if the backend returns a different format)
    if (res.ok && (data.success === true || data.message === "Login successful")) {
      // If you expect a token, store it
      if (data.access_token) {
        localStorage.setItem("access_token", data.access_token);
      }
      // Redirect based on role or dashboard
      window.location.href = "/admin/dashboard";
    } else {
      // Show the exact error from the backend
      statusEl.innerText = data.message || data.error || "Incorrect OTP. Please try again.";
    }
  } catch (err) {
    statusEl.innerText = "Server error";
  }
}
</script>
{% endblock %}
