{% extends "layouts/layout_app.html" %}

{% block title %}Map | LANDMARK{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    .map-wrap {
        width: 100%;
        min-height: 600px;
    }
    #map {
        width: 100%;
        height: 600px;
        min-height: 600px;
        background: #e8eef4;
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-radius: 12px;
        z-index: 1;
    }
    .map-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
        align-items: center;
    }
    .map-toolbar input {
        flex: 1;
        min-width: 180px;
        background: #0c121e;
        border: 1px solid rgba(0, 255, 255, 0.35);
        color: #eef5ff;
        border-radius: 999px;
        padding: 10px 16px;
        outline: none;
    }
    .map-toolbar button {
        border: 1px solid #0ff;
        background: #0ff;
        color: #031018;
        font-weight: 700;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
    }
    .map-toolbar .locate {
        background: transparent;
        color: #0ff;
    }
    .map-radius-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        align-items: center;
        flex-wrap: wrap;
    }
    .map-radius-bar label {
        color: #9ab;
        font-size: 0.85rem;
        font-weight: 600;
    }
    .map-radius-bar select {
        background: #0c121e;
        border: 1px solid rgba(0, 255, 255, 0.35);
        color: #eef5ff;
        border-radius: 999px;
        padding: 10px 16px;
        outline: none;
        cursor: pointer;
    }
    .map-status { color: #9ab; font-size: 0.85rem; margin-top: 8px; }
    .map-popup h3 { margin: 0 0 6px; font-size: 1rem; }
    .map-popup p { margin: 0 0 4px; font-size: 0.85rem; }
    .map-popup a {
        display: inline-block;
        margin-right: 6px;
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.8rem;
    }
    .map-popup .call { background: #0ff; color: #031018; }
    .map-popup .wa { background: #25d366; color: #fff; }
    .pulse-icon { background: transparent; border: none; }
    .pulse-pin {
        position: relative;
        width: 22px;
        height: 22px;
    }
    .pulse-pin .dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        background: #e11d48;
        border: 2px solid #fff;
        border-radius: 50%;
        z-index: 2;
        box-shadow: 0 0 8px rgba(225, 29, 72, 0.8);
    }
    .pulse-pin .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: rgba(225, 29, 72, 0.45);
        animation: landmark-pulse 1.6s ease-out infinite;
        z-index: 1;
    }
    @keyframes landmark-pulse {
        0% { transform: scale(1); opacity: 0.7; }
        70% { transform: scale(3.4); opacity: 0; }
        100% { transform: scale(3.4); opacity: 0; }
    }
</style>
{% endblock %}

{% block content %}
<div class="map-wrap">
    <form class="map-toolbar" id="mapSearchForm">
        <input type="search" id="mapSearch" placeholder="Search a business name and press Enter…" autocomplete="off">
        <button type="button" class="locate" id="locateBtn">📍 My location</button>
        <button type="submit" id="searchBtn">Search</button>
    </form>
    <div class="map-radius-bar">
        <label for="radiusFilter">Distance</label>
        <select id="radiusFilter">
            <option value="">All</option>
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="20">20 km</option>
            <option value="30">30 km</option>
            <option value="50">50 km</option>
        </select>
    </div>
    <div id="map"></div>
    <p class="map-status" id="mapStatus">Loading map…</p>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
    const INDIA = [20.5937, 78.9629];
    const STREET_ZOOM = 16;
    const statusEl = document.getElementById('mapStatus');
    const mapEl = document.getElementById('map');
    const searchInput = document.getElementById('mapSearch');

    function setStatus(msg) {
        if (statusEl) statusEl.textContent = msg;
    }

    if (typeof L === 'undefined') {
        setStatus('Leaflet failed to load. Check your network and refresh.');
        return;
    }
    if (!mapEl) {
        setStatus('Map container missing.');
        return;
    }

    const map = L.map(mapEl, { zoomControl: true }).setView(INDIA, 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    setTimeout(function () { map.invalidateSize(); }, 200);
    window.addEventListener('resize', function () { map.invalidateSize(); });

    const markers = L.layerGroup().addTo(map);
    const pulseIcon = L.divIcon({
        className: 'pulse-icon',
        html: '<div class="pulse-pin"><span class="ring"></span><span class="dot"></span></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        popupAnchor: [0, -12]
    });

    let allBusinesses = [];
    let focusMarker = null;
    let userLatLng = null;
    const radiusFilter = document.getElementById('radiusFilter');

    function authHeaders() {
        return {};
    }

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function digits(phone) {
        return String(phone || '').replace(/\D/g, '');
    }

    function popupHtml(b) {
        const phone = digits(b.phone);
        const wa = digits(b.whatsapp || b.phone);
        const rating = Number(b.rating || 0).toFixed(1);
        const callHref = phone ? ('tel:' + phone) : '#';
        const waHref = wa ? ('https://wa.me/' + (wa.length === 10 ? '91' + wa : wa)) : '#';
        return '<div class="map-popup">'
            + '<h3>' + escapeHtml(b.business_name || 'Business') + '</h3>'
            + '<p>' + escapeHtml(b.category || '') + ' · ★ ' + rating + '</p>'
            + '<p>' + escapeHtml(b.phone || 'No phone listed') + '</p>'
            + '<a class="call" href="' + callHref + '">Call</a>'
            + '<a class="wa" href="' + waHref + '" target="_blank" rel="noopener">WhatsApp</a>'
            + '</div>';
    }

    function coords(b) {
        const lat = Number(b.latitude);
        const lng = Number(b.longitude);
        if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return null;
        return [lat, lng];
    }

    function renderMarkers(list) {
        markers.clearLayers();
        (list || []).forEach(function (b) {
            const ll = coords(b);
            if (!ll) return;
            L.marker(ll).bindPopup(popupHtml(b)).addTo(markers);
        });
        setStatus((list || []).length + ' businesses on map');
        map.invalidateSize();
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
        const toRad = function (d) { return d * Math.PI / 180; };
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
            + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
            * Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return 2 * 6371 * Math.asin(Math.sqrt(a));
    }

    function originForRadius() {
        if (userLatLng) return userLatLng;
        const c = map.getCenter();
        if (c && Number(c.lat) && Number(c.lng) && map.getZoom() >= 10) {
            return [c.lat, c.lng];
        }
        return null;
    }

    function applyRadiusFilter() {
        const km = parseFloat(radiusFilter && radiusFilter.value);
        if (!km) {
            renderMarkers(allBusinesses);
            return;
        }
        const origin = originForRadius();
        if (!origin) {
            setStatus('Please enable location to use distance filters.');
            if (radiusFilter) radiusFilter.value = '';
            return;
        }
        const filtered = allBusinesses.filter(function (b) {
            const ll = coords(b);
            if (!ll) return false;
            return haversineKm(origin[0], origin[1], ll[0], ll[1]) <= km;
        });
        renderMarkers(filtered);
        if (filtered.length) {
            const bounds = L.latLngBounds(filtered.map(function (b) { return coords(b); }).filter(Boolean));
            if (bounds.isValid()) map.fitBounds(bounds.pad(0.15));
        } else {
            setStatus('No businesses within ' + km + ' km');
        }
    }

    function ensureLocationThenFilter() {
        const km = parseFloat(radiusFilter && radiusFilter.value);
        if (!km) {
            applyRadiusFilter();
            return;
        }
        if (originForRadius()) {
            applyRadiusFilter();
            return;
        }
        if (!navigator.geolocation) {
            setStatus('Please enable location to use distance filters.');
            if (radiusFilter) radiusFilter.value = '';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                userLatLng = [pos.coords.latitude, pos.coords.longitude];
                applyRadiusFilter();
            },
            function () {
                setStatus('Please enable location to use distance filters.');
                if (radiusFilter) radiusFilter.value = '';
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
    }

    function pickBestMatch(list, q) {
        if (!list || !list.length) return null;
        const needle = (q || '').trim().toLowerCase();
        if (!needle) return list[0];
        const exact = list.find(function (b) {
            return (b.business_name || '').toLowerCase() === needle;
        });
        if (exact) return exact;
        const starts = list.find(function (b) {
            return (b.business_name || '').toLowerCase().indexOf(needle) === 0;
        });
        return starts || list[0];
    }

    function flyToBusiness(b) {
        const ll = coords(b);
        if (!ll) {
            setStatus('That business has no map coordinates');
            return;
        }
        if (focusMarker) {
            map.removeLayer(focusMarker);
            focusMarker = null;
        }
        focusMarker = L.marker(ll, { icon: pulseIcon, zIndexOffset: 1000 })
            .bindPopup(popupHtml(b), { autoPan: true })
            .addTo(map);

        map.flyTo(ll, STREET_ZOOM, { animate: true, duration: 1.75, easeLinearity: 0.25 });
        map.once('moveend', function () {
            if (focusMarker) focusMarker.openPopup();
            map.invalidateSize();
        });
        setStatus('Flying to ' + (b.business_name || 'business'));
    }

    async function fetchJson(url) {
        const res = await fetch(url, { headers: authHeaders(), credentials: 'include' });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok || data.success === false) throw new Error(data.error || 'Request failed');
        return data;
    }

    async function loadBusinesses() {
        setStatus('Loading businesses…');
        try {
            const data = await fetchJson('/api/nearby/businesses');
            allBusinesses = Array.isArray(data) ? data : (data.businesses || []);
            renderMarkers(allBusinesses);
        } catch (err) {
            setStatus(err.message || 'Could not load businesses');
        }
    }

    async function searchAndFly(q) {
        q = (q || '').trim();
        if (!q) {
            renderMarkers(allBusinesses);
            setStatus((allBusinesses.length || 0) + ' businesses on map');
            return;
        }
        setStatus('Searching…');
        try {
            const data = await fetchJson('/api/nearby/search?q=' + encodeURIComponent(q));
            const list = Array.isArray(data) ? data : (data.businesses || []);
            renderMarkers(list.length ? list : allBusinesses);
            const target = pickBestMatch(list, q);
            if (!target) {
                setStatus('No business matched “' + q + '”');
                return;
            }
            flyToBusiness(target);
        } catch (err) {
            const local = allBusinesses.filter(function (b) {
                return (b.business_name || '').toLowerCase().indexOf(q.toLowerCase()) >= 0
                    || (b.category || '').toLowerCase().indexOf(q.toLowerCase()) >= 0;
            });
            renderMarkers(local);
            const target = pickBestMatch(local, q);
            if (target) flyToBusiness(target);
            else setStatus(err.message || 'Search failed');
        }
    }

    async function flyToId(id) {
        try {
            const data = await fetchJson('/api/nearby/businesses/' + encodeURIComponent(id));
            const b = data.business || data;
            if (!b || !b.latitude) throw new Error('Business not found');
            flyToBusiness(b);
        } catch (err) {
            setStatus(err.message || 'Could not open that listing');
        }
    }

    function locateUser() {
        if (!navigator.geolocation) {
            setStatus('Geolocation not supported');
            return;
        }
        setStatus('Finding your location…');
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                const ll = [pos.coords.latitude, pos.coords.longitude];
                userLatLng = ll;
                map.flyTo(ll, 14, { animate: true, duration: 1.4 });
                L.circleMarker(ll, {
                    radius: 8,
                    color: '#2563eb',
                    fillColor: '#3b82f6',
                    fillOpacity: 0.9
                }).addTo(map).bindPopup('You are here');
                setStatus('Centered on your location');
            },
            function () {
                setStatus('Location denied — showing India');
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
    }

    document.getElementById('mapSearchForm').addEventListener('submit', function (e) {
        e.preventDefault();
        searchAndFly(searchInput.value);
    });
    document.getElementById('locateBtn').addEventListener('click', locateUser);
    if (radiusFilter) {
        radiusFilter.addEventListener('change', ensureLocationThenFilter);
    }

    const params = new URLSearchParams(window.location.search);
    const deepId = params.get('id');
    const deepQ = params.get('q') || params.get('search');
    if (deepQ) searchInput.value = deepQ;

    loadBusinesses().then(function () {
        if (deepId) return flyToId(deepId);
        if (deepQ) return searchAndFly(deepQ);
        locateUser();
    });
})();
</script>
{% endblock %}
