{% extends "layouts/layout_public.html" %}

{% block title %}Register | LANDMARK{% endblock %}

{% block content %}

<style>
.register-wrapper {
    text-align: center;
    width: 100%;
    max-width: 400px;
}

.register-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 5px;
}

.page-subtitle {
    margin-bottom: 20px;
}

.btn-primary {
    width: 100%;
    margin-top: 10px;
}

.status-text {
    text-align: center;
    min-height: 20px;
}

#otpGroup {
    display: none;
}
</style>

<div class="container">
    <div class="card register-wrapper">

        <h2 class="register-title">Create Account</h2>
        <p class="page-subtitle">Join LANDMARK & start earning 💰</p>

        <form onsubmit="event.preventDefault(); sendRegistrationOtp();">

            <input type="hidden" id="refParam" value="">

            <input
                id="phone"
                type="text"
                placeholder="Phone number"
                maxlength="10"
                required
            >

            <input
                id="name"
                type="text"
                placeholder="Your name"
                required
            >

            <input
                id="referral"
                type="text"
                placeholder="Referral Code (optional)"
            >

            <button
                id="sendOtpBtn"
                type="submit"
                class="btn-primary">
                Get Started
            </button>
        </form>

        <div id="otpGroup" style="margin-top:15px;">

            <input
                id="otp"
                type="text"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                inputmode="numeric"
            >

            <button
                id="verifyOtpBtn"
                type="button"
                class="btn-primary"
                onclick="verifyRegistrationOtp()">
                Verify OTP
            </button>

        </div>

        <p id="statusMessage" class="status-text"></p>

        <p style="margin-top:15px; font-size:14px;">
            Already have an account?
            <a
                id="loginLink"
                href="/api/auth/public/login"
                style="color:#ffd700;">
                Login
            </a>
        </p>

    </div>
</div>

<script>

let registrationSubmitting = false;
let verificationSubmitting = false;
let pendingPhone = "";
let pendingName = "";
let pendingReferral = "";

(function () {

    const urlRef =
        new URLSearchParams(window.location.search).get("ref") || "";

    if (urlRef) {

        document.getElementById("refParam").value = urlRef;
        document.getElementById("referral").value = urlRef;

        document.getElementById("loginLink").href =
            "/api/auth/public/login?ref=" +
            encodeURIComponent(urlRef);
    }

})();

async function sendRegistrationOtp() {

    if (registrationSubmitting) {
        return;
    }

    const phone =
        document.getElementById("phone").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const referral =
        (
            document.getElementById("refParam").value ||
            document.getElementById("referral").value ||
            ""
        ).trim();

    const status =
        document.getElementById("statusMessage");

    const sendBtn =
        document.getElementById("sendOtpBtn");

    if (!phone || !name) {

        status.innerText =
            "Phone and name are required.";

        return;
    }

    if (!/^[6-9]\d{9}$/.test(phone)) {

        status.innerText =
            "Enter a valid 10-digit Indian phone number.";

        return;
    }

    registrationSubmitting = true;
    sendBtn.disabled = true;

    pendingPhone = phone;
    pendingName = name;
    pendingReferral = referral;

    status.innerText = "Sending OTP...";

    try {

        const qs =
            referral
                ? "?ref=" + encodeURIComponent(referral)
                : "";

        const response =
            await fetch("/api/auth/send-otp" + qs, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone,
                    name: name,
                    ref: referral
                })
            });

        const data = await response.json();

        if (response.ok && data.success) {

            status.innerText =
                "✅ OTP sent. Enter the OTP below.";

            document.getElementById("otpGroup").style.display =
                "block";

            document.getElementById("otp").focus();

        } else {

            status.innerText =
                data.message ||
                data.error ||
                "Failed to send OTP.";

            registrationSubmitting = false;
            sendBtn.disabled = false;
        }

    } catch (error) {

        status.innerText =
            "Server error. Please try again.";

        registrationSubmitting = false;
        sendBtn.disabled = false;
    }
}

async function verifyRegistrationOtp() {

    if (verificationSubmitting) {
        return;
    }

    const otp =
        document.getElementById("otp").value.trim();

    const status =
        document.getElementById("statusMessage");

    const verifyBtn =
        document.getElementById("verifyOtpBtn");

    if (!/^\d{6}$/.test(otp)) {

        status.innerText =
            "Enter the 6-digit OTP.";

        return;
    }

    verificationSubmitting = true;
    verifyBtn.disabled = true;

    status.innerText =
        "Verifying OTP...";

    try {

        const referral = pendingReferral;

        const response =
            await fetch("/api/auth/verify-otp", {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: pendingPhone,
                    otp: otp,
                    ref: referral,
                    name: pendingName
                })
            });

        const data =
            await response.json();

        if (response.ok && data.success) {

            status.innerText =
                "✅ Registration successful. Redirecting...";

            setTimeout(function () {
                window.location.href = "/dashboard";
            }, 500);

        } else {

            status.innerText =
                data.message ||
                data.error ||
                "Verification failed. Please try again.";

            verificationSubmitting = false;
            verifyBtn.disabled = false;

            document.getElementById("otp").value = "";
            document.getElementById("otp").focus();
        }

    } catch (error) {

        status.innerText =
            "Server error. Please try again.";

        verificationSubmitting = false;
        verifyBtn.disabled = false;
    }
}

</script>

{% endblock %}
