{% extends "layouts/layout_app.html" %}

{% block title %}Edit Listing | LANDMARK{% endblock %}

{% block content %}

<div class="container">

<h2>Edit Listing</h2>

<div class="card">

<input type="text" id="business_name" placeholder="Business Name">

<input type="text" id="category" placeholder="Category">

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<textarea id="description" placeholder="Description"></textarea>

<button class="btn-primary" onclick="updateListing()">Update Listing</button>

<p id="statusMessage" class="status-text"></p>

</div>

</div>


<script>
const listingId = window.location.pathname.split("/").pop();
// Business Power organization context is a UI convenience only (a plain
// URL query param) -- the server independently re-authorizes every
// request through organization_authz.py regardless of what this says.
const orgId = new URLSearchParams(window.location.search).get('org');
const loadUrl = orgId
  ? `/api/organization/${encodeURIComponent(orgId)}/businesses/${listingId}`
  : `/api/listing/listing/${listingId}`;
const saveUrl = orgId
  ? `/api/organization/${encodeURIComponent(orgId)}/businesses/${listingId}`
  : `/api/listing/update-listing/${listingId}`;

document.addEventListener("DOMContentLoaded", function(){
  LandmarkSession.authFetch(loadUrl)
    .then(res => res.json())
    .then(data => {
      document.getElementById("business_name").value = data.business_name || "";
      document.getElementById("category").value = data.category || "";
      document.getElementById("city").value = data.city || "";
      document.getElementById("state").value = data.state || "";
      document.getElementById("description").value = data.description || "";
    })
    .catch(() => {
      document.getElementById("statusMessage").innerText = "Unable to load listing.";
    });
});

function updateListing(){
  const business_name = document.getElementById("business_name").value.trim();
  const category = document.getElementById("category").value.trim();
  const city = document.getElementById("city").value.trim();
  const state = document.getElementById("state").value.trim();
  const description = document.getElementById("description").value.trim();
  const status = document.getElementById("statusMessage");

  if(!business_name || !category){
    status.innerText = "Business name and category are required.";
    return;
  }

  LandmarkSession.authFetch(saveUrl, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      business_name,
      category,
      city,
      state,
      description
    })
  })
  .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
  .then(({ ok, status: http, data }) => {
    if (http === 403) {
      status.innerText = data.error || "Not allowed";
      return;
    }
    if (ok) {
      status.innerText = data.message || "Listing updated";
    } else {
      status.innerText = data.error || "Update failed";
    }
  })
  .catch(() => {
    status.innerText = "Network error";
  });
}
</script>

{% endblock %}
