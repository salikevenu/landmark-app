{% extends "layouts/layout_app.html" %}
{% block title %}Pricing | LANDMARK{% endblock %}
{% block content %}
<style>
  .pricing-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    color: #eef5ff;
  }
  .plans {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }
  .plan-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px 22px;
    width: 260px;
    text-align: center;
    transition: 0.3s;
  }
  .plan-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 20px rgba(255,215,0,0.2);
  }
  .plan-card h3 {
    color: #facc15;
    margin-bottom: 10px;
  }
  .price {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    margin: 15px 0;
  }
  .btn-plan {
    background: linear-gradient(135deg, #facc15, #f59e0b);
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: 700;
    color: #1a1a1a;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
    width: 100%;
  }
  .btn-plan:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .no-plans-msg {
    color: #cbd5e1;
    text-align: center;
    width: 100%;
  }
  .plan-card p {
    color: #cbd5e1;
  }
  .plan-features {
    font-size: 0.9rem;
    line-height: 1.45;
    min-height: 4.2em;
    margin: 0 0 8px;
  }
  .billing-cycle {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px auto 28px;
  }
  .billing-cycle button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #eef5ff;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 600;
  }
  .billing-cycle button.active {
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #1a1a1a;
    border-color: transparent;
  }
  .price-sub {
    color: #94a3b8;
    font-size: 0.85rem;
    margin: 0;
  }
</style>

<div class="pricing-container">
  <h2 style="text-align:center; color:#facc15;" id="pricingHeading">Choose Your Plan</h2>
  <div class="billing-cycle" id="billingCycle">
    <button type="button" data-cycle="monthly" class="active">Monthly</button>
    <button type="button" data-cycle="3months">3 Months (Save 10%)</button>
    <button type="button" data-cycle="yearly">Yearly (Save 30%)</button>
  </div>
  <div class="plans" id="plansContainer">
    <!-- Plans will be rendered by JavaScript -->
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  // All available plans – each plan now has 'eligibleRoles' so the
  // page knows who is allowed to see / buy it. Adjust these lists
  // to match your actual upgrade rules.
  const PAGE_TYPE = {{ (page_type or '')|tojson }};

  const ALL_PLANS = [
    {
      id: "Service Provider",
      name: "Service Provider",
      price: 299,
      pageTypes: ["service"],
      eligibleRoles: ["free"],
      features: "Manage up to 3 services, analytics dashboard, priority support."
    },
    {
      id: "Business Basic",
      name: "Business Basic",
      price: 699,
      pageTypes: ["business"],
      eligibleRoles: ["free", "service_provider"],
      features: "1 verified listing, basic analytics, standard support."
    },
    {
      id: "Business Premium",
      name: "Business Premium",
      price: 1499,
      pageTypes: ["business"],
      eligibleRoles: ["free", "service_provider", "business_basic"],
      features: "3 verified listings, advanced analytics, priority support, featured badge."
    },
    {
      id: "Business Power",
      name: "Business Power",
      custom: true,
      pageTypes: ["business"],
      eligibleRoles: ["free", "service_provider", "business_basic", "business_premium"],
      features: "Unlimited businesses, all Business Premium features, central business management."
    }
  ];

  let selectedCycle = "monthly";

  function billedPaise(monthlyRupees) {
    const monthlyPaise = Math.round(monthlyRupees * 100);
    if (selectedCycle === "3months") return Math.floor(monthlyPaise * 3 * 90 / 100);
    if (selectedCycle === "yearly") return Math.floor(monthlyPaise * 12 * 70 / 100);
    return monthlyPaise;
  }

  function formatRupees(paise) {
    return (paise / 100).toLocaleString("en-IN", {
      minimumFractionDigits: paise % 100 ? 2 : 0,
      maximumFractionDigits: 2
    });
  }

  function subscribeLabel() {
    if (selectedCycle === "3months") return "Subscribe for 3 Months";
    if (selectedCycle === "yearly") return "Subscribe Yearly";
    return "Choose Plan";
  }

  function priceCaption() {
    if (selectedCycle === "3months") return "for 3 months";
    if (selectedCycle === "yearly") return "per year";
    return "per month";
  }

  // Reads a cookie value by name (used to grab the CSRF token
  // that flask-jwt-extended sets alongside the login cookie).
  function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match.pop()) : '';
  }

  function paymentHeaders() {
    const headers = {
      "Content-Type": "application/json"
    };
    const csrf = window.LandmarkSession
      ? LandmarkSession.csrfToken()
      : (function() {
          const match = document.cookie.match('(^|;)\\s*csrf_access_token\\s*=\\s*([^;]+)');
          return match ? decodeURIComponent(match.pop()) : '';
        })();
    if (csrf) headers["X-CSRF-TOKEN"] = csrf;
    return headers;
  }

  async function loadPlans() {
    // Fetch current user role from subscription-status endpoint
    let userRole = "free";
    try {
      const res = await fetch("/api/user/subscription-status", {
        credentials: "include",
        headers: paymentHeaders()
      });
      if (res.ok) {
        const data = await res.json();
        userRole = data.role;
      }
    } catch (e) {
      console.error("Could not fetch role", e);
    }

    const container = document.getElementById("plansContainer");
    container.innerHTML = "";

    const heading = document.getElementById("pricingHeading");
    if (PAGE_TYPE === "service" && heading) heading.textContent = "Service Provider Plan";
    if (PAGE_TYPE === "business" && heading) heading.textContent = "Business Plans";

    const visiblePlans = ALL_PLANS.filter(plan => {
      if (PAGE_TYPE === "service" || PAGE_TYPE === "business") {
        return plan.pageTypes.includes(PAGE_TYPE);
      }
      return plan.eligibleRoles.includes(userRole);
    });

    if (visiblePlans.length === 0) {
      container.innerHTML = '<p class="no-plans-msg">No plans available for your current account. You may already be on the top plan.</p>';
      return;
    }

    visiblePlans.forEach(plan => {
      const card = document.createElement("div");
      card.className = "plan-card";

      if (plan.custom) {
        // Enterprise / contact-sales plan — no fixed price, no self-service
        // Razorpay checkout. Activation is admin-only (see services/admin_service.py).
        card.innerHTML = `
          <h3>${plan.name}</h3>
          <div class="price">Custom Pricing</div>
          <p class="price-sub">Contact Sales</p>
          <p class="plan-features">${plan.features}</p>
          <a class="btn-plan" style="display:inline-block; text-decoration:none; box-sizing:border-box;"
             href="mailto:support@landmarkvts.in?subject=Business%20Power%20Enterprise%20Plan">
            Contact Sales
          </a>
        `;
        container.appendChild(card);
        return;
      }

      const paise = billedPaise(plan.price);
      card.innerHTML = `
        <h3>${plan.name}</h3>
        <div class="price">₹${formatRupees(paise)}</div>
        <p class="price-sub">${priceCaption()}</p>
        <p class="plan-features">${plan.features}</p>
        <button class="btn-plan" onclick="startPayment('${plan.name}', event)">
          ${subscribeLabel()}
        </button>
      `;
      container.appendChild(card);
    });
  }

  async function startPayment(planName, event) {
    const button = event.target;
    button.disabled = true;
    button.innerText = "Processing...";

    try {
      const res = await fetch("/api/payment/create-order", {
        method: "POST",
        headers: paymentHeaders(),
        credentials: "include",
        body: JSON.stringify({
          plan: planName,
          billing_cycle: selectedCycle
        })
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        alert(data.error || "Unable to create order");
        button.disabled = false;
        button.innerText = subscribeLabel();
        return;
      }

      const options = {
        key: data.key,
        amount: data.amount,
        currency: data.currency,
        order_id: data.order_id,
        name: "LANDMARK",
        description: planName,
        handler: async function (response) {
          try {
            const verifyRes = await fetch("/api/payment/verify-payment", {
              method: "POST",
              headers: paymentHeaders(),
              credentials: "include",
              body: JSON.stringify({
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_signature: response.razorpay_signature
              })
            });

            const verifyData = await verifyRes.json();

            if (verifyRes.ok && verifyData.success) {
              alert(verifyData.message || "Payment successful!");
              window.location.href = verifyData.redirect || "/dashboard";
            } else {
              alert(verifyData.error || "Payment verification failed");
              button.disabled = false;
              button.innerText = subscribeLabel();
            }
          } catch (verifyError) {
            console.error("Verification error:", verifyError);
            alert("Payment verification failed. Please contact support.");
            button.disabled = false;
            button.innerText = subscribeLabel();
          }
        },
        modal: {
          ondismiss: function () {
            button.disabled = false;
            button.innerText = subscribeLabel();
          }
        },
        theme: {
          color: "#facc15"
        },
        prefill: {
          name: "",
          email: "",
          contact: ""
        },
        notes: {
          plan: planName,
          source: "web"
        }
      };

      const rzp = new Razorpay(options);

      rzp.on('payment.failed', function (response) {
        console.error("Payment failed:", response.error);
        alert(response.error.description || "Payment failed. Please try again.");
        button.disabled = false;
        button.innerText = subscribeLabel();
      });

      rzp.open();

    } catch (error) {
      console.error("Payment initiation error:", error);
      alert("Payment initiation failed: " + (error.message || "Unknown error"));
      button.disabled = false;
            button.innerText = subscribeLabel();
    }
  }

  document.getElementById("billingCycle").addEventListener("click", function (event) {
    const btn = event.target.closest("button[data-cycle]");
    if (!btn) return;
    selectedCycle = btn.getAttribute("data-cycle");
    document.querySelectorAll("#billingCycle button").forEach(el => {
      el.classList.toggle("active", el === btn);
    });
    loadPlans();
  });

  document.addEventListener("DOMContentLoaded", loadPlans);
</script>
{% endblock %}
