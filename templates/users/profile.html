{% extends "layouts/layout_app.html" %}

{% block title %}Profile | LANDMARK{% endblock %}

{% block content %}

<div class="profile-container">
  <div class="profile-header">
    <h1 class="page-title">My <span class="gradient-text">Profile</span></h1>
  </div>

  <div class="profile-card">
    <div id="profileData" class="profile-info">
      <div class="spinner"></div>
      <p class="loading-text">Loading profile...</p>
    </div>
    <div id="upgradeSection" class="upgrade-section" style="display: none;">
      <button class="btn-upgrade" onclick="goPricing()">Upgrade Plan</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<style>
  .profile-container {
    max-width: 700px;
    margin: 2rem auto;
    padding: 1rem;
  }
  .profile-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .page-title {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #e0f2fe, #a5f3fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }
  .gradient-text {
    background: linear-gradient(135deg, #00ffff, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .profile-card {
    background: rgba(15, 25, 45, 0.7);
    backdrop-filter: blur(12px);
    border-radius: 2rem;
    border: 1px solid rgba(0, 255, 255, 0.25);
    box-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    transition: all 0.2s;
  }
  .profile-info {
    padding: 2rem;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    padding: 1rem 0;
    border-bottom: 1px solid rgba(0, 255, 255, 0.15);
    gap: 0.75rem;
  }
  .info-row:last-child {
    border-bottom: none;
  }
  .info-label {
    font-weight: 600;
    color: #9ab3d5;
    letter-spacing: 0.5px;
  }
  .info-value {
    font-weight: 500;
    color: #f0f6ff;
    word-break: break-word;
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .name-display {
    cursor: pointer;
    border-bottom: 1px dashed rgba(0, 255, 255, 0.45);
    padding-bottom: 1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .name-display:hover {
    color: #0ff;
    border-color: #0ff;
  }
  .name-input {
    background: #0f1522;
    border: 1px solid #0ff;
    border-radius: 0.75rem;
    color: #f0f6ff;
    padding: 0.35rem 0.7rem;
    font-size: 1rem;
    font-weight: 500;
    min-width: 160px;
    max-width: 260px;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.12);
  }
  .referral-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.04em;
    color: #0ff;
  }
  .btn-copy {
    background: rgba(0, 255, 255, 0.1);
    border: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 2rem;
    padding: 0.25rem 0.85rem;
    font-size: 0.75rem;
    color: #00ffff;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
  }
  .btn-copy:hover {
    background: rgba(0, 255, 255, 0.28);
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.35);
  }
  .btn-copy:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .upgrade-section {
    text-align: center;
    padding: 1rem 2rem 2rem;
  }
  .btn-upgrade {
    background: linear-gradient(95deg, #f0b90b, #ffd700);
    border: none;
    border-radius: 3rem;
    padding: 0.6rem 2rem;
    font-weight: 700;
    color: #0a0f1c;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
  }
  .btn-upgrade:hover {
    transform: scale(1.02);
    background: linear-gradient(95deg, #ffd700, #ffb347);
    box-shadow: 0 0 15px gold;
  }
  .spinner {
    width: 32px;
    height: 32px;
    margin: 1rem auto;
    border: 3px solid rgba(0, 255, 255, 0.2);
    border-top: 3px solid #0ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    text-align: center;
    color: #8ca3c0;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 24, 36, 0.95);
    color: #0ff;
    border: 1px solid rgba(0, 255, 255, 0.45);
    border-radius: 999px;
    padding: 0.7rem 1.25rem;
    font-weight: 600;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    color: #ffb4b4;
    border-color: rgba(255, 120, 120, 0.55);
  }
  @media (max-width: 600px) {
    .info-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .info-value {
      text-align: left;
      justify-content: flex-start;
      width: 100%;
    }
    .name-input {
      max-width: 100%;
      width: 100%;
    }
  }
</style>

<script>
  let currentUser = null;
  let savingName = false;

  function escapeHtml(str) {
    if (str == null) return "";
    return String(str).replace(/[&<>"']/g, function (m) {
      return ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[m];
    });
  }

  function showToast(message, isError) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.toggle("error", !!isError);
    toast.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  function authHeaders(json) {
    const headers = {};
    if (window.LandmarkSession) {
      const csrf = LandmarkSession.csrfToken();
      if (csrf) headers["X-CSRF-TOKEN"] = csrf;
    }
    if (json) headers["Content-Type"] = "application/json";
    return headers;
  }

  function renderProfile(user) {
    currentUser = user;
    const displayName = user.name || user.phone || "User";
    const referral = user.referral_code || "";

    document.getElementById("profileData").innerHTML = `
      <div class="info-row">
        <div class="info-label">📱 Phone</div>
        <div class="info-value">${escapeHtml(user.phone || "-")}</div>
      </div>
      <div class="info-row">
        <div class="info-label">👤 Name</div>
        <div class="info-value" id="nameValue">
          <span class="name-display" id="nameDisplay" title="Click to edit">${escapeHtml(displayName)}</span>
        </div>
      </div>
      <div class="info-row">
        <div class="info-label">🎭 Role</div>
        <div class="info-value">${escapeHtml(user.role || "User")}</div>
      </div>
      <div class="info-row">
        <div class="info-label">💎 Plan</div>
        <div class="info-value">${escapeHtml(user.plan || "Free")}</div>
      </div>
      <div class="info-row">
        <div class="info-label">🔗 Referral Code</div>
        <div class="info-value">
          <span class="referral-code" id="referralCode">${escapeHtml(referral || "—")}</span>
          <button type="button" class="btn-copy" id="copyReferralBtn" ${referral ? "" : "disabled"}>
            ${referral ? "Copy" : "N/A"}
          </button>
        </div>
      </div>
    `;

    document.getElementById("nameDisplay").addEventListener("click", startNameEdit);
    const copyBtn = document.getElementById("copyReferralBtn");
    if (referral) copyBtn.addEventListener("click", copyReferralCode);

    const upgradeSection = document.getElementById("upgradeSection");
    if (user.plan === "free" || user.role === "user") {
      upgradeSection.style.display = "block";
    } else {
      upgradeSection.style.display = "none";
    }
  }

  function startNameEdit() {
    if (savingName) return;
    const wrap = document.getElementById("nameValue");
    const current = (currentUser && (currentUser.name || currentUser.phone)) || "";
    wrap.innerHTML = `<input class="name-input" id="nameInput" type="text" maxlength="100" value="${escapeHtml(current)}" aria-label="Edit name">`;
    const input = document.getElementById("nameInput");
    input.focus();
    input.select();

    let finished = false;
    const finish = async (save) => {
      if (finished) return;
      finished = true;
      if (!save) {
        renderProfile(currentUser);
        return;
      }
      await saveName(input.value);
    };

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
      } else if (e.key === "Escape") {
        e.preventDefault();
        finish(false);
      }
    });
    input.addEventListener("blur", () => finish(true));
  }

  async function saveName(rawName) {
    const newName = String(rawName || "").trim();
    const previous = (currentUser && (currentUser.name || currentUser.phone)) || "";

    if (!newName) {
      showToast("Name cannot be empty", true);
      renderProfile(currentUser);
      return;
    }
    if (newName === previous) {
      renderProfile(currentUser);
      return;
    }

    savingName = true;
    try {
      const res = window.LandmarkSession
        ? await LandmarkSession.authFetch("/api/user/profile/update", {
            method: "PUT",
            headers: authHeaders(true),
            body: JSON.stringify({ name: newName })
          })
        : await fetch("/api/user/profile/update", {
            method: "PUT",
            credentials: "include",
            headers: authHeaders(true),
            body: JSON.stringify({ name: newName })
          });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showToast(data.error || "Update failed", true);
        renderProfile(currentUser);
        return;
      }
      currentUser = { ...currentUser, name: data.name || newName };
      renderProfile(currentUser);
      showToast("Saved!");
    } catch (err) {
      console.error(err);
      showToast("Network error. Please try again.", true);
      renderProfile(currentUser);
    } finally {
      savingName = false;
    }
  }

  async function copyReferralCode() {
    const code = (currentUser && currentUser.referral_code) || "";
    if (!code) {
      showToast("No referral code available", true);
      return;
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
      } else {
        const ta = document.createElement("textarea");
        ta.value = code;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      showToast("Referral code copied!");
    } catch (err) {
      console.error(err);
      showToast("Could not copy referral code", true);
    }
  }

  async function loadProfile() {
    try {
      const response = window.LandmarkSession
        ? await LandmarkSession.authFetch("/api/user/profile/data")
        : await fetch("/api/user/profile/data", { credentials: "include" });

      if (!response.ok) {
        if (response.status === 401) {
          if (window.LandmarkSession) LandmarkSession.redirectToLogin();
          else window.location.href = "/api/auth/public/login";
          return;
        }
        throw new Error("Failed to fetch profile");
      }

      const user = await response.json();
      renderProfile(user);
    } catch (err) {
      console.error(err);
      document.getElementById("profileData").innerHTML =
        `<div class="info-row"><div class="info-label">⚠️ Unable to load profile. Please try again later.</div></div>`;
    }
  }

  function goPricing() {
    window.location.href = "/pricing";
  }

  document.addEventListener("DOMContentLoaded", loadProfile);
</script>

{% endblock %}
